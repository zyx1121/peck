name: CI
on:
  # `edited` matters: a retitle changes the commit message a squash merge will
  # write, so the title gate has to run again.
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  # release-please.yml dispatches this workflow on the release branch, so the
  # release pull request carries checks without a PAT.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  # Every run, a retitle included, builds the head commit in full: a skipped
  # job counts as passing a required check, so no run may skip the build.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same set release-please-config.json gives a changelog section.
          types: |
            feat
            fix
            perf
            refactor
            docs
            ci
            chore
            test
            build
            revert
          requireScope: false
          # A changelog line reads as prose, so the subject starts lowercase.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" of pull request "{title}" starts with an
            uppercase letter. Conventional Commit subjects are lowercase.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1100x24' npm run smoke
      - if: runner.os == 'macOS'
        run: npm run package:mac
      - if: runner.os == 'macOS'
        run: npm run smoke
        env:
          PECK_EXECUTABLE_PATH: release/Peck-darwin-arm64/Peck.app/Contents/MacOS/Peck
          PECK_BRIDGE_PATH: release/Peck-darwin-arm64/Peck.app/Contents/Resources/app.asar/dist-electron/bridge.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: output/playwright/
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent release/Peck-darwin-arm64/Peck.app release/Peck-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Peck-macos-arm64
          path: release/Peck-macos-arm64.zip
